    --limestone:#F3F0E8;
    --paper:#FCFBF8;

  *{box-sizing:border-box;}

  body{

  .brand{

    position:relative;
  }
  .brand-word{

    font-size:26px;

  .nav-item{

    color:#C7D0DA;
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;

  .nav-item.active{background:var(--azulejo); color:#fff;}
  .nav-icon{width:18px; text-align:center; font-size:14px; opacity:0.9;}
  .nav-count{

    font-size:11px;

  .sidebar-foot{

  .topbar{

  .topbar h1{

<div id="root"></div>
<script>
  // Rede de segurança: se por algum motivo a app não conseguir arrancar
  // (erro de rede, CDN bloqueado, etc.), mostra sempre uma mensagem —
  // nunca uma página em branco sem explicação.
  window.addEventListener('error', function(e){
    setTimeout(function(){
      var root = document.getElementById('root');
      if(root && root.innerHTML.trim() === ''){
        root.innerHTML =
          '<div style="max-width:520px;margin:60px auto;padding:26px 28px;' +
          'font-family:IBM Plex Sans, sans-serif;background:#FCFBF8;' +
          'border:1px solid #DEDACD;border-radius:12px;color:#2B2B28;">' +
          '<h2 style="color:#AE4331;margin-top:0;">A aplicação não conseguiu arrancar</h2>' +
          '<p style="font-size:13.5px;line-height:1.6;">Ocorreu um erro inesperado ao carregar a página. ' +
          'Abra a consola do navegador (tecla F12 → separador "Console") para ver o detalhe técnico.</p>' +
          '<pre style="white-space:pre-wrap;background:#F3F0E8;padding:10px 12px;border-radius:8px;font-size:12px;overflow:auto;">' +
          (e && e.message ? e.message.replace(/</g,'&lt;') : 'Erro desconhecido') +
          '</pre></div>';
      }
    }, 50);
  });
</script>

// Comprime e redimensiona uma imagem no browser antes de guardar (reduz muito o espaço ocupado)
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1280;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({base64: dataUrl.split(',')[1] || '', tipo:'image/jpeg'});
      };
      img.onerror = () => reject(new Error('Não foi possível processar a imagem.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Não foi possível ler o ficheiro.'));
    reader.readAsDataURL(file);
  });
}
function base64ToBlob(base64, type){
  const byteChars = atob(base64);
  const byteNumbers = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
  return new Blob([new Uint8Array(byteNumbers)], {type: type || 'application/pdf'});
}

  } catch(e){
    supabaseInitError = 'Não foi possível iniciar o Supabase: ' + (e && e.message ? e.message : String(e)) + '. Confirme que copiou corretamente o Project URL e a anon key.';
  }
}

const TABLE_MAP = {
  imoveis: 'imoveis',
  inquilinos: 'inquilinos',
  contratos: 'contratos',
  pagamentos: 'pagamentos',
  manutencoes: 'manutencoes',
  tarefas: 'tarefas',
  documentos: 'documentos',
  listaEspera: 'lista_espera',
  proprietarios: 'proprietarios',
  atualizacoesRenda: 'atualizacoes_renda',
  vistorias: 'vistorias',
  despesas: 'despesas',
};

/* ============================== Storage layer (Supabase Storage — anexos) ============================== */
function storageAvailable(){
  return !!(supabase && currentSession && currentSession.user);
}
let currentSession = null; // definida pelo useAuth() ao autenticar

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function storeGet(key){
  if(!storageAvailable()) return null;
  const path = currentSession.user.id + '/' + key;
  const { data, error } = await supabase.storage.from('anexos').download(path);
  if(error || !data) return null;
  return await blobToBase64(data);
}
async function storeSet(key, base64Value){
  if(!storageAvailable()) throw new Error('Sem sessão iniciada.');
  const path = currentSession.user.id + '/' + key;
  const blob = base64ToBlob(base64Value, 'application/octet-stream');
  const { error } = await supabase.storage.from('anexos').upload(path, blob, { upsert: true });
  if(error) throw error;
}
async function storeDelete(key){
  if(!storageAvailable()) return;
  const path = currentSession.user.id + '/' + key;
  try{ await supabase.storage.from('anexos').remove([path]); } catch(e){ /* ignora */ }
}

/* ============================== Autenticação ============================== */
function useAuth(){
  const [session, setSession] = useState(undefined); // undefined = a carregar, null = sem sessão
  const [authError, setAuthError] = useState('');

  useEffect(() => {
    if(!supabase){ setSession(null); return; }
    supabase.auth.getSession().then(({data}) => {
      currentSession = data.session;
      setSession(data.session);
    });
    const { data: listener } = supabase.auth.onAuthStateChange((_event, s) => {
      currentSession = s;
      setSession(s);
    });
    return () => listener && listener.subscription && listener.subscription.unsubscribe();
  }, []);

  const signUp = async (email, password) => {
    setAuthError('');
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) setAuthError(error.message);
    return !error;
  };
  const signIn = async (email, password) => {
    setAuthError('');
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) setAuthError(error.message);
    return !error;
  };
  const signOut = async () => { await supabase.auth.signOut(); };

  return { session, authError, signUp, signIn, signOut };
}

/* ============================== Storage hook (dados sincronizados via Supabase) ============================== */
function useAppData(userId){
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [syncError, setSyncError] = useState('');

  useEffect(() => {
    if(!userId){ setData(null); setLoaded(false); return; }
    setLoaded(false);
    (async () => {
      try{
        const keys = Object.keys(TABLE_MAP);
        const results = await Promise.all(keys.map(async (key) => {
          const { data: rows, error } = await supabase.from(TABLE_MAP[key]).select('data');
          if(error) throw error;
          return [key, (rows||[]).map(r => r.data)];
        }));
        const assembled = {};
        results.forEach(([key, arr]) => { assembled[key] = arr; });
        setData(assembled);
      } catch(e){
        setSyncError('Não foi possível carregar os dados (' + ((e&&e.message)||'erro desconhecido') + ').');
        setData(seedData()); // fallback local, apenas nesta sessão — não é guardado
      } finally {
        setLoaded(true);
      }
    })();
  }, [userId]);

  return [data, setData, loaded, syncError];
}

async function persistUpsert(key, item, userId){
  const table = TABLE_MAP[key];
  if(!table) return;
  const { error } = await supabase.from(table).upsert({ id: item.id, user_id: userId, data: item, updated_at: new Date().toISOString() });
  if(error) alert('Não foi possível guardar a alteração (' + error.message + '). Tente novamente.');
}
async function persistDelete(key, id){
  const table = TABLE_MAP[key];
  if(!table) return;
  const { error } = await supabase.from(table).delete().eq('id', id);
  if(error) alert('Não foi possível remover (' + error.message + '). Tente novamente.');
}

/* ============================== Small UI atoms ============================== */
function Tag({children, kind}){
  return <span className={'tag tag-'+kind}>{children}</span>;
}

function estadoImovelTag(estado){
  if(estado==='Ocupado') return <Tag kind="verdigris">Ocupado</Tag>;
  if(estado==='Vago') return <Tag kind="rust">Vago</Tag>;
  return <Tag kind="amber">Em Manutenção</Tag>;
}

function estadoManutTag(estado){
  if(estado==='Concluído') return <Tag kind="verdigris">Concluído</Tag>;
  if(estado==='Em Curso') return <Tag kind="amber">Em Curso</Tag>;
  return <Tag kind="rust">Pendente</Tag>;
}

function estadoPagamento(p){
  if(p.valorPago){
    if(p.dataPagamento && p.dataVencimento && p.dataPagamento > p.dataVencimento) return {label:'Pago com Atraso', kind:'amber'};
    return {label:'Pago', kind:'verdigris'};
  }
  if(p.dataVencimento && p.dataVencimento < todayISO()) return {label:'Em Atraso', kind:'rust'};
  return {label:'Pendente', kind:'gray'};
}

function estadoWaitlistTag(estado){
  if(estado==='Convertido') return <Tag kind="verdigris">Convertido</Tag>;
  if(estado==='Contactado') return <Tag kind="azulejo">Contactado</Tag>;
  if(estado==='Inativo') return <Tag kind="gray">Inativo</Tag>;
  return <Tag kind="amber">Ativo</Tag>;
}

function Modal({title, onClose, children}){
  return (
    <div className="overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal">
        <h2>{title}</h2>

  );
}

/* ============================== Waitlist matching ============================== */
function matchesImovel(entry, imovel){
  if(imovel.estado !== 'Vago') return false;
  if(entry.tipo && entry.tipo !== imovel.tipo) return false;
  if(entry.zona && !(imovel.morada||'').toLowerCase().includes(entry.zona.toLowerCase())) return false;
  if(entry.rendaMax && Number(imovel.renda) > Number(entry.rendaMax)) return false;
  if(entry.quartosMin && Number(imovel.quartos||0) < Number(entry.quartosMin)) return false;
  return true;
}

function percentByImovel(proprietarios, imovelId){
  return proprietarios.filter(p=>p.imovelId===imovelId).reduce((s,p)=>s+Number(p.percentagem||0),0);
}

    return <ConfigNeededScreen/>;
  }
  if(supabaseInitError){
    return <InitErrorScreen message={supabaseInitError} />;
  }
  const {session, authError, signUp, signIn, signOut} = useAuth();

  if(session === undefined){
    return <div className="auth-screen"><div className="auth-card"><div className="brand-word" style={{color:'var(--ink)'}}>Predial</div><p style={{color:'var(--gray)'}}>A verificar sessão…</p></div></div>;

}

function LoginScreen({authError, onSignUp, onSignIn}){
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup'

  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [info, setInfo] = useState('');

  const submit = async () => {
    setBusy(true);
    setInfo('');
    if(mode === 'signup'){
      const ok = await onSignUp(email, password);
      if(ok) setInfo('Conta criada. Verifique o seu email para confirmar, depois entre normalmente.');
    } else {
      await onSignIn(email, password);
    }

  };

  return (
    <div className="auth-screen">
      <div className="auth-card">
        <div className="brand-word" style={{color:'var(--ink)', marginBottom:2}}>Predial</div>

          <button className={mode==='signup' ? 'btn btn-primary btn-sm' : 'btn btn-ghost btn-sm'} onClick={()=>setMode('signup')}>Criar conta</button>
        </div>

          <label>Palavra-passe</label>

        </div>

        {authError && <div style={{color:'var(--rust)', fontSize:12.5, marginBottom:12}}>{authError}</div>}
        {info && <div style={{color:'var(--verdigris)', fontSize:12.5, marginBottom:12}}>{info}</div>}

function MainApp({userId, userEmail, onSignOut}){
  const [data, setData, loaded, syncError] = useAppData(userId);
  const [view, setView] = useState('dashboard');
  const [modal, setModal] = useState(null); // {type, item}

  if(!loaded || !data){
    return <div style={{padding:'60px', fontFamily:'IBM Plex Sans, sans-serif', color:'#7C7A72'}}>A carregar o Predial…</div>;
  }

  const update = (key, fn) => setData(d => ({...d, [key]: fn(d[key])}));

  const addOrEdit = (key, item) => {
    update(key, list => {
      const exists = list.some(x => x.id === item.id);
      return exists ? list.map(x => x.id===item.id ? item : x) : [...list, item];
    });
    persistUpsert(key, item, userId);
  };
  const remove = (key, id) => {
    update(key, list => list.filter(x => x.id!==id));
    persistDelete(key, id);
  };

  const NAV = [
    {id:'dashboard', label:'Escritório', icon:'🏛'},
    {id:'imoveis', label:'Imóveis', icon:'🏠'},
    {id:'proprietarios', label:'Proprietários', icon:'🧾'},
    {id:'inquilinos', label:'Inquilinos', icon:'👤'},
    {id:'contratos', label:'Contratos', icon:'📄'},
    {id:'pagamentos', label:'Pagamentos', icon:'€'},
    {id:'manutencao', label:'Manutenção', icon:'🔧'},
    {id:'vistorias', label:'Vistorias', icon:'📷'},
    {id:'despesas', label:'Despesas', icon:'📊'},
    {id:'listaespera', label:'Lista de Espera', icon:'⏳'},
    {id:'tarefas', label:'Tarefas', icon:'✓'},
    {id:'documentos', label:'Documentos', icon:'📁'},
  ];

  const counts = {
    imoveis: data.imoveis.length,
    inquilinos: data.inquilinos.length,
    contratos: data.contratos.length,
    pagamentos: data.pagamentos.filter(p => estadoPagamento(p).label==='Em Atraso').length,

    proprietarios: data.imoveis.filter(im => {
      const soma = percentByImovel(data.proprietarios, im.id);

    }).length,
    listaespera: data.listaEspera.filter(w => w.estado==='Ativo').length,
    tarefas: data.tarefas.filter(t => !t.concluida).length,

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-word">Predial</div>

              <span className="nav-icon">{n.icon}</span>
              <span className="label">{n.label}</span>
              {n.id==='pagamentos' && counts.pagamentos>0 && <span className="nav-count alert">{counts.pagamentos}</span>}
              {n.id==='manutencao' && counts.manutencao>0 && <span className="nav-count">{counts.manutencao}</span>}
              {n.id==='proprietarios' && counts.proprietarios>0 && <span className="nav-count alert">{counts.proprietarios}</span>}
              {n.id==='listaespera' && counts.listaespera>0 && <span className="nav-count">{counts.listaespera}</span>}
              {n.id==='tarefas' && counts.tarefas>0 && <span className="nav-count">{counts.tarefas}</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot">
          {syncError ? <div style={{color:'#F3C7BC', marginBottom:8}}>⚠ {syncError}</div> : null}
          <div style={{marginBottom:8, wordBreak:'break-all'}}>{userEmail}</div>
          <button className="btn btn-ghost btn-sm" style={{color:'#EDEFF2', borderColor:'rgba(255,255,255,0.25)'}} onClick={onSignOut}>Sair</button>
        </div>
      </aside>

      <main className="main">
        {view==='dashboard' && <Dashboard data={data} setView={setView} />}
        {view==='imoveis' && <ImoveisView data={data} addOrEdit={addOrEdit} remove={remove} modal={modal} setModal={setModal} setView={setView} />}
        {view==='proprietarios' && <ProprietariosView data={data} addOrEdit={addOrEdit} remove={remove} modal={modal} setModal={setModal} />}
        {view==='inquilinos' && <InquilinosView data={data} addOrEdit={addOrEdit} remove={remove} modal={modal} setModal={setModal} />}

/* ============================== Dashboard ============================== */
function Dashboard({data, setView}){
  const ocupados = data.imoveis.filter(i=>i.estado==='Ocupado').length;
  const vagos = data.imoveis.filter(i=>i.estado==='Vago').length;
  const total = data.imoveis.length;
  const receita = data.imoveis.reduce((s,i)=>s+Number(i.renda||0),0);
  const taxaOcup = total ? Math.round((ocupados/total)*100) : 0;
  const emAtraso = data.pagamentos.filter(p=>estadoPagamento(p).label==='Em Atraso');
  const tarefasPendentes = data.tarefas.filter(t=>!t.concluida).sort((a,b)=>(a.dataLimite||'').localeCompare(b.dataLimite||''));
  const proximosPagamentos = data.pagamentos
    .filter(p=>!p.valorPago)
    .sort((a,b)=>(a.dataVencimento||'').localeCompare(b.dataVencimento||''))
    .slice(0,5);
  const esperaAtivos = data.listaEspera.filter(w=>w.estado==='Ativo');
  const vagosComInteressados = data.imoveis.filter(im => im.estado==='Vago' && esperaAtivos.some(w=>matchesImovel(w,im)));

  const contratoOf = (id) => data.contratos.find(c=>c.id===id);
  const imovelOf = (id) => data.imoveis.find(i=>i.id===id);

  return (
    <React.Fragment>
      <div className="topbar">
        <div>
          <h1>Escritório</h1>
          <p>Uma visão geral da sua atividade de arrendamento.</p>
        </div>
      </div>
      <div className="content">
        <div className="kpi-row">
          <div className="kpi-hero">
            <div className="label">Receita mensal potencial</div>
            <div className="value">{fmtEUR(receita)}</div>
            <div className="foot">{total} imóve{total===1?'l':'is'} sob gestão · {taxaOcup}% de ocupação</div>
          </div>
          <div className="kpi-card">
            <div className="label">Imóveis ocupados</div>
            <div className="value verdigris">{ocupados}</div>
          </div>
          <div className="kpi-card">
            <div className="label">Imóveis vagos</div>
            <div className="value rust">{vagos}</div>
          </div>
          <div className="kpi-card">
            <div className="label">Pagamentos em atraso</div>
            <div className="value rust">{emAtraso.length}</div>
          </div>
        </div>

        <div className="dash-grid">
          <div>
            <div className="panel">
              <h3>Próximos pagamentos <span className="muted">por vencer</span></h3>
              {proximosPagamentos.length===0 && <div className="empty">Sem pagamentos pendentes de registo.</div>}
              {proximosPagamentos.map(p=>{
                const ct = contratoOf(p.contratoId);
                const im = ct ? imovelOf(ct.imovelId) : null;
                const est = estadoPagamento(p);
                return (
                  <div className="list-row" key={p.id}>
                    <div>
                      <div className="t1">{im ? im.nome : p.contratoId} — {p.mesRef}</div>
                      <div className="t2">Vencimento: {fmtDate(p.dataVencimento)}</div>
                    </div>
                    <Tag kind={est.kind}>{est.label}</Tag>
                  </div>
                );
              })}
            </div>

            <div className="panel">
              <h3>Lista de espera <span className="muted">{esperaAtivos.length} interessados ativos</span></h3>
              {vagosComInteressados.length===0 && <div className="empty">Nenhum imóvel vago corresponde, por agora, a um interessado em espera.</div>}
              {vagosComInteressados.map(im=>{
                const matches = esperaAtivos.filter(w=>matchesImovel(w,im));
                return (
                  <div className="list-row" key={im.id}>
                    <div>
                      <div className="t1">{im.nome}</div>
                      <div className="t2">{matches.length} interessado{matches.length!==1?'s':''} compatíve{matches.length!==1?'is':'l'} · {fmtEUR(im.renda)}</div>
                    </div>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setView('listaespera')}>Ver</button>
                  </div>
                );
              })}
            </div>
          </div>

          <div>
            <div className="panel">
              <h3>Tarefas pendentes</h3>
              {tarefasPendentes.length===0 && <div className="empty">Sem tarefas pendentes. 🎉</div>}
              {tarefasPendentes.slice(0,6).map(t=>{
                const d = daysUntil(t.dataLimite);
                const atrasada = d!==null && d<0;
                return (
                  <div className="list-row" key={t.id}>
                    <div>
                      <div className="t1">{t.titulo}</div>
                      <div className="t2">{t.dataLimite ? fmtDate(t.dataLimite) : 'Sem prazo'}</div>
                    </div>
                    {atrasada ? <Tag kind="rust">Atrasada</Tag> : (d!==null && d<=7 ? <Tag kind="amber">Em breve</Tag> : null)}
                  </div>
                );
              })}
            </div>

            <div className="panel">
              <h3>Manutenção em curso</h3>
              {data.manutencoes.filter(m=>m.estado!=='Concluído').length===0 && <div className="empty">Sem pedidos de manutenção ativos.</div>}
              {data.manutencoes.filter(m=>m.estado!=='Concluído').slice(0,6).map(m=>{
                const im = imovelOf(m.imovelId);
                return (
                  <div className="list-row" key={m.id}>
                    <div>
                      <div className="t1">{im ? im.nome : m.imovelId}</div>
                      <div className="t2">{m.descricao}</div>
                    </div>
                    {estadoManutTag(m.estado)}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );

        <div>
          <h1>{title}</h1>
          {subtitle && <p>{subtitle}</p>}
        </div>
        {onNew && <button className="btn btn-primary" onClick={onNew}>{newLabel || '+ Novo'}</button>}
      </div>
      <div className="content">{children}</div>
    </React.Fragment>
  );
}

function useFiltered(list, query, fields){
  return useMemo(()=>{
    if(!query) return list;
    const q = query.toLowerCase();
    return list.filter(item => fields.some(f => String(item[f]||'').toLowerCase().includes(q)));
  },[list, query, fields]);
}

/* ============================== Contratos ============================== */
function rendaAtual(contratoId, contratoRendaInicial, atualizacoesRenda){
  const historico = atualizacoesRenda.filter(a=>a.contratoId===contratoId).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  if(historico.length===0) return Number(contratoRendaInicial||0);
  return Number(historico[historico.length-1].valorNovo||0);
}

function avisoRescisaoInfo(c){
  if(c.rescindido || !c.dataFim || !c.prazoAvisoRescisao) return null;
  const dFim = new Date(c.dataFim+'T00:00:00');
  const dLimite = new Date(dFim.getTime() - Number(c.prazoAvisoRescisao)*86400000);
  const dLimiteISO = dLimite.toISOString().slice(0,10);
  return {dataLimiteISO: dLimiteISO, dias: daysUntil(dLimiteISO)};
}

function ContratosView({data, addOrEdit, remove, modal, setModal}){
  const empty = {id:'', imovelId:'', inquilinoId:'', dataInicio:'', dataFim:'', renda:'', caucao:'', prazoAvisoRescisao:120, rescindido:false, dataRescisao:'', motivoRescisao:'', temAnexoRescisao:false, anexoRescisaoNome:'', anexoRescisaoTipo:'', notas:''};
  const imovelNome = (id) => { const im = data.imoveis.find(i=>i.id===id); return im ? im.nome : '—'; };
  const inquilinoNome = (id) => { const iq = data.inquilinos.find(i=>i.id===id); return iq ? iq.nome : '—'; };
  const [expanded, setExpanded] = useState(null);
  const [busyId, setBusyId] = useState(null);

  const estadoContrato = (c) => {
    if(c.rescindido) return {label:'Rescindido', kind:'rust'};
    const d = daysUntil(c.dataFim);
    if(d===null) return {label:'—', kind:'gray'};
    if(d<0) return {label:'Terminado', kind:'rust'};
    if(d<=60) return {label:'A Expirar', kind:'amber'};
    return {label:'Ativo', kind:'verdigris'};
  };

  const saveAtualizacao = (formData) => {
    addOrEdit('atualizacoesRenda', formData);
    setModal(null);
  };

  const saveRescisao = async (contrato, formData, fileAction) => {
    let updated = {...contrato, rescindido:true, dataRescisao:formData.dataRescisao, motivoRescisao:formData.motivoRescisao};
    if(fileAction && fileAction.type==='set'){
      if(!storageAvailable()){
        alert('O seu navegador não permite guardar anexos neste contexto. A rescisão foi registada sem a carta.');
      } else {
        try{
          await storeSet('predial:anexo:rescisao:'+contrato.id, fileAction.base64);
          updated = {...updated, temAnexoRescisao:true, anexoRescisaoNome:fileAction.nome, anexoRescisaoTipo:fileAction.tipo};
        } catch(e){
          const detalhe = (e && e.name==='QuotaExceededError') ? 'o espaço de armazenamento do navegador está cheio' : ((e && e.message) || 'erro desconhecido');
          alert('Não foi possível guardar a carta de rescisão (' + detalhe + '). A rescisão foi registada sem o anexo.');
        }
      }
    }
    addOrEdit('contratos', updated);
    setModal(null);
  };

  const anularRescisao = async (c) => {
    if(c.temAnexoRescisao) await storeDelete('predial:anexo:rescisao:'+c.id);
    addOrEdit('contratos', {...c, rescindido:false, dataRescisao:'', motivoRescisao:'', temAnexoRescisao:false, anexoRescisaoNome:'', anexoRescisaoTipo:''});
  };

  const verCartaRescisao = async (c) => {
    setBusyId(c.id);
    try{
      const raw = await storeGet('predial:anexo:rescisao:'+c.id);
      if(!raw){ alert('Carta não encontrada.'); return; }
      const blob = base64ToBlob(raw, c.anexoRescisaoTipo);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    } catch(e){
      alert('Não foi possível abrir a carta.');
    } finally {
      setBusyId(null);
    }
  };

  return (
    <PageShell title="Contratos" subtitle="Contratos de arrendamento, atualizações de renda e rescisões." onNew={()=>setModal({type:'contrato', item:{...empty, id:uid('CT')}})}>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Contrato</th><th>Imóvel</th><th>Inquilino</th><th>Período</th><th>Renda Atual</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {data.contratos.map(c=>{
              const est = estadoContrato(c);
              const renda = rendaAtual(c.id, c.renda, data.atualizacoesRenda);
              const aviso = avisoRescisaoInfo(c);
              const historico = data.atualizacoesRenda.filter(a=>a.contratoId===c.id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
              return (
                <React.Fragment key={c.id}>
                  <tr>
                    <td style={{fontWeight:600}}>{c.id}</td>
                    <td>{imovelNome(c.imovelId)}</td>
                    <td>{inquilinoNome(c.inquilinoId)}</td>
                    <td>{fmtDate(c.dataInicio)} → {fmtDate(c.dataFim)}</td>
                    <td>
                      {fmtEUR(renda)}
                      {renda !== Number(c.renda||0) && <div style={{fontSize:11, color:'var(--gray)'}}>inicial: {fmtEUR(c.renda)}</div>}
                    </td>
                    <td>
                      <Tag kind={est.kind}>{est.label}</Tag>
                      {aviso && aviso.dias!==null && aviso.dias<=30 && (
                        <div style={{marginTop:5}}>
                          <Tag kind={aviso.dias<0 ? 'rust' : 'amber'}>
                            {aviso.dias<0 ? 'Prazo de aviso expirado' : ('Enviar aviso até ' + fmtDate(aviso.dataLimiteISO))}
                          </Tag>
                        </div>
                      )}
                    </td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" onClick={()=>setExpanded(expanded===c.id ? null : c.id)}>{expanded===c.id ? 'Fechar' : 'Detalhes'}</button>
                        <button className="icon-btn" onClick={()=>setModal({type:'contrato', item:c})}>Editar</button>
                        <button className="icon-btn danger" onClick={()=>remove('contratos', c.id)}>Remover</button>
                      </div>
                    </td>
                  </tr>
                  {expanded===c.id && (
                    <tr><td colSpan="7" style={{background:'var(--limestone)', padding:0}}>
                      <div style={{padding:'16px 18px'}}>

                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
                          <div style={{fontWeight:700, fontSize:13}}>Prazo para aviso de rescisão</div>
                        </div>

function RescisaoForm({item, onSave, onCancel}){
  const [f, setF] = useState({dataRescisao:item.dataRescisao, motivoRescisao:item.motivoRescisao});
  const [pendingFile, setPendingFile] = useState(null);
  const [error, setError] = useState('');
  const set = (k,v)=>setF(s=>({...s,[k]:v}));

  const onFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    setError('');
    if(!file) return;
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if(!isPdf){ setError('Só é possível anexar ficheiros PDF.'); e.target.value=''; return; }
    if(file.size > MAX_ANEXO_BYTES){ setError('O PDF é demasiado grande (máx. 2 MB).'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      setPendingFile({nome:file.name, tipo:file.type || 'application/pdf', base64});
    };
    reader.onerror = () => setError('Não foi possível ler o ficheiro.');
    reader.readAsDataURL(file);
  };

  const handleSubmit = () => {
    if(!f.dataRescisao){ setError('Indique a data de rescisão.'); return; }
    const fileAction = pendingFile ? {type:'set', ...pendingFile} : null;
    onSave(f, fileAction);
  };

  return (
    <React.Fragment>
      <div className="form-grid">
        <div className="field"><label>Data de rescisão</label><input type="date" value={f.dataRescisao} onChange={e=>set('dataRescisao',e.target.value)} /></div>
        <div className="field full"><label>Motivo</label><input placeholder="ex: pedido do inquilino, incumprimento…" value={f.motivoRescisao} onChange={e=>set('motivoRescisao',e.target.value)} /></div>
        <div className="field full">
          <label>Carta de rescisão (PDF, opcional)</label>
          <input type="file" accept="application/pdf,.pdf" onChange={onFileChange} />
          {error && <div style={{color:'var(--rust)', fontSize:12}}>{error}</div>}
          {pendingFile && <div style={{color:'var(--verdigris)', fontSize:12}}>Pronto para guardar: {pendingFile.nome}</div>}
        </div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-danger-ghost" onClick={handleSubmit}>Confirmar rescisão</button>
      </div>
    </React.Fragment>
  );
}

function VistoriasView({data, addOrEdit, remove, modal, setModal}){
  const empty = {id:'', imovelId:'', tipo:'Entrada', data:todayISO(), descricao:'', notas:'', fotos:[]};
  const imovelNome = (id) => { const im = data.imoveis.find(i=>i.id===id); return im ? im.nome : '—'; };
  const [busyKey, setBusyKey] = useState(null);

  const handleSave = async (formData, pendingNewFotos, removedFotoIds) => {
    for(const fid of removedFotoIds){ await storeDelete('predial:foto:'+fid); }
    let novasFotos = [];
    for(const pf of pendingNewFotos){
      try{
        await storeSet('predial:foto:'+pf.id, pf.base64);
        novasFotos.push({id:pf.id, nome:pf.nome});
      } catch(e){
        const detalhe = (e && e.name==='QuotaExceededError') ? 'o espaço de armazenamento do navegador está cheio' : ((e && e.message) || 'erro desconhecido');
        alert('Não foi possível guardar uma fotografia (' + detalhe + '). As restantes foram guardadas.');
      }
    }
    const fotosFinal = [...(formData.fotos||[]).filter(f=>!removedFotoIds.includes(f.id)), ...novasFotos];
    addOrEdit('vistorias', {...formData, fotos: fotosFinal});
    setModal(null);
  };

  const handleRemove = async (vt) => {
    for(const f of (vt.fotos||[])){ await storeDelete('predial:foto:'+f.id); }
    remove('vistorias', vt.id);
  };

  const handleViewFoto = async (vtId, foto) => {
    const key = vtId+':'+foto.id;
    setBusyKey(key);
    try{
      const raw = await storeGet('predial:foto:'+foto.id);
      if(!raw){ alert('Fotografia não encontrada.'); return; }
      const blob = base64ToBlob(raw, 'image/jpeg');
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    } catch(e){
      alert('Não foi possível abrir a fotografia.');
    } finally {
      setBusyKey(null);
    }
  };

  return (
    <PageShell title="Vistorias" subtitle="Registo fotográfico do estado do imóvel — útil como prova em disputas de caução." onNew={()=>setModal({type:'vistoria', item:{...empty, id:uid('VT')}})}>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Imóvel</th><th>Tipo</th><th>Data</th><th>Descrição</th><th>Fotos</th><th></th></tr></thead>
          <tbody>

function VistoriaForm({item, imoveis, onSave, onCancel}){
  const [f, setF] = useState(item);
  const [pendingNewFotos, setPendingNewFotos] = useState([]); // {id, nome, base64, tipo}
  const [removedFotoIds, setRemovedFotoIds] = useState([]);
  const [error, setError] = useState('');
  const [processing, setProcessing] = useState(false);
  const set = (k,v)=>setF(s=>({...s,[k]:v}));

  const fotosExistentes = (f.fotos||[]).filter(fo=>!removedFotoIds.includes(fo.id));

  const onFilesChange = async (e) => {
    const files = Array.from(e.target.files || []);
    setError('');
    if(files.length===0) return;
    setProcessing(true);
    const novas = [];
    for(const file of files){
      if(!file.type.startsWith('image/')){ setError('Só é possível anexar imagens.'); continue; }
      try{
        const {base64, tipo} = await compressImageFile(file);
        novas.push({id: uid('FT'), nome: file.name, base64, tipo});
      } catch(err){
        setError('Não foi possível processar uma das imagens.');
      }
    }
    setPendingNewFotos(s => [...s, ...novas]);
    setProcessing(false);
    e.target.value = '';
  };

  const handleSubmit = () => {
    onSave(f, pendingNewFotos, removedFotoIds);
  };

  return (
    <React.Fragment>
      <div className="form-grid">
        <div className="field"><label>Imóvel</label>
          <select value={f.imovelId} onChange={e=>set('imovelId',e.target.value)}>
            <option value="">—</option>
            {imoveis.map(im=><option key={im.id} value={im.id}>{im.nome}</option>)}
          </select>
        </div>
        <div className="field"><label>Tipo de vistoria</label>
          <select value={f.tipo} onChange={e=>set('tipo',e.target.value)}>
            {TIPOS_VISTORIA.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div className="field"><label>Data</label><input type="date" value={f.data} onChange={e=>set('data',e.target.value)} /></div>
        <div className="field full"><label>Descrição do estado do imóvel</label><input value={f.descricao} onChange={e=>set('descricao',e.target.value)} /></div>

        <div className="field full">
          <label>Fotografias</label>
          <input type="file" accept="image/*" multiple onChange={onFilesChange} />
          {processing && <div style={{fontSize:12, color:'var(--gray)'}}>A processar imagens…</div>}
          {error && <div style={{color:'var(--rust)', fontSize:12}}>{error}</div>}

          {(fotosExistentes.length>0 || pendingNewFotos.length>0) && (
            <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:8}}>
              {fotosExistentes.map(fo=>(
                <div key={fo.id} style={{textAlign:'center'}}>
                  <div style={{width:64, height:64, background:'var(--limestone)', border:'1px solid var(--line)', borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20}}>📷</div>
                  <div style={{fontSize:10, color:'var(--gray)', maxWidth:64, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{fo.nome}</div>
                  <button type="button" className="icon-btn danger btn-sm" style={{marginTop:2}} onClick={()=>setRemovedFotoIds(s=>[...s, fo.id])}>Remover</button>
                </div>
              ))}
              {pendingNewFotos.map(pf=>(
                <div key={pf.id} style={{textAlign:'center'}}>
                  <img src={'data:'+pf.tipo+';base64,'+pf.base64} style={{width:64, height:64, objectFit:'cover', borderRadius:6, border:'1px solid var(--line)'}} />
                  <div style={{fontSize:10, color:'var(--verdigris)'}}>nova</div>
                  <button type="button" className="icon-btn danger btn-sm" style={{marginTop:2}} onClick={()=>setPendingNewFotos(s=>s.filter(x=>x.id!==pf.id))}>Remover</button>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="field full"><label>Notas</label><textarea value={f.notas} onChange={e=>set('notas',e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" onClick={handleSubmit}>Guardar</button>
      </div>
    </React.Fragment>
  );
}

function DespesasView({data, addOrEdit, remove, modal, setModal}){
  const empty = {id:'', imovelId:'', data:todayISO(), anoFiscal:new Date().getFullYear(), categoria:'Obras', descricao:'', valor:'', dedutivel:true, notas:'', temComprovativo:false, comprovativoNome:'', comprovativoTipo:''};
  const imovelNome = (id) => { const im = data.imoveis.find(i=>i.id===id); return im ? im.nome : '—'; };
  const [busyId, setBusyId] = useState(null);
  const [filtroAno, setFiltroAno] = useState('todos');
  const [filtroImovel, setFiltroImovel] = useState('todos');

  const anos = [...new Set(data.despesas.map(d=>d.anoFiscal))].sort((a,b)=>b-a);
  const filtradas = data.despesas.filter(d =>
    (filtroAno==='todos' || String(d.anoFiscal)===String(filtroAno)) &&
    (filtroImovel==='todos' || d.imovelId===filtroImovel)
  );
  const totalGeral = filtradas.reduce((s,d)=>s+Number(d.valor||0), 0);
  const totalDedutivel = filtradas.filter(d=>d.dedutivel).reduce((s,d)=>s+Number(d.valor||0), 0);

  const handleSave = async (formData, fileAction) => {
    let updated = {...formData, anoFiscal: formData.data ? Number(formData.data.slice(0,4)) : formData.anoFiscal};
    if(fileAction && fileAction.type==='set'){
      if(!storageAvailable()){
        alert('O seu navegador não permite guardar anexos neste contexto. A despesa foi guardada sem comprovativo.');
      } else {
        try{
          await storeSet('predial:anexo:despesa:'+formData.id, fileAction.base64);
          updated = {...updated, temComprovativo:true, comprovativoNome:fileAction.nome, comprovativoTipo:fileAction.tipo};
        } catch(e){
          const detalhe = (e && e.name==='QuotaExceededError') ? 'o espaço de armazenamento do navegador está cheio' : ((e && e.message) || 'erro desconhecido');
          alert('Não foi possível guardar o comprovativo (' + detalhe + '). A despesa foi guardada sem anexo.');
        }
      }
    } else if(fileAction && fileAction.type==='remove'){
      await storeDelete('predial:anexo:despesa:'+formData.id);
      updated = {...updated, temComprovativo:false, comprovativoNome:'', comprovativoTipo:''};
    }
    addOrEdit('despesas', updated);
    setModal(null);
  };

  const handleRemove = async (d) => {
    if(d.temComprovativo) await storeDelete('predial:anexo:despesa:'+d.id);
    remove('despesas', d.id);
  };

  const handleView = async (d) => {
    setBusyId(d.id);
    try{
      const raw = await storeGet('predial:anexo:despesa:'+d.id);
      if(!raw){ alert('Comprovativo não encontrado.'); return; }
      const blob = base64ToBlob(raw, d.comprovativoTipo);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    } catch(e){
      alert('Não foi possível abrir o comprovativo.');
    } finally {
      setBusyId(null);
    }
  };

  return (
    <PageShell title="Despesas" subtitle="Despesas do imóvel, catalogadas por ano fiscal — úteis para o IRS Categoria F." onNew={()=>setModal({type:'despesa', item:{...empty, id:uid('DP')}})}>
      <div className="toolbar">
        <div style={{display:'flex', gap:10}}>
          <select className="search" style={{width:140}} value={filtroAno} onChange={e=>setFiltroAno(e.target.value)}>
            <option value="todos">Todos os anos</option>
            {anos.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <select className="search" style={{width:180}} value={filtroImovel} onChange={e=>setFiltroImovel(e.target.value)}>
            <option value="todos">Todos os imóveis</option>
            {data.imoveis.map(im=><option key={im.id} value={im.id}>{im.nome}</option>)}
          </select>
        </div>
      </div>

      <div className="kpi-row" style={{gridTemplateColumns:'1fr 1fr', marginBottom:18}}>
        <div className="kpi-card">
          <div className="label">Total no período filtrado</div>
          <div className="value">{fmtEUR(totalGeral)}</div>
        </div>
        <div className="kpi-card">
          <div className="label">Dedutível (IRS Categoria F)</div>
          <div className="value verdigris">{fmtEUR(totalDedutivel)}</div>
        </div>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Imóvel</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Dedutível</th><th>Comprovativo</th><th></th></tr></thead>
          <tbody>
            {filtradas.map(d=>(
              <tr key={d.id}>
                <td>{fmtDate(d.data)}</td>
                <td style={{fontWeight:600}}>{imovelNome(d.imovelId)}</td>
                <td><Tag kind="azulejo">{d.categoria}</Tag></td>
                <td>{d.descricao}</td>
                <td>{fmtEUR(d.valor)}</td>
                <td>{d.dedutivel ? <Tag kind="verdigris">Sim</Tag> : <Tag kind="gray">Não</Tag>}</td>
                <td>
                  {d.temComprovativo ? (
                    <button className="icon-btn" disabled={busyId===d.id} onClick={()=>handleView(d)}>
                      📎 {busyId===d.id ? 'A abrir…' : 'Ver'}
                    </button>
                  ) : <span style={{color:'var(--gray)', fontSize:12}}>—</span>}
                </td>
                <td>
                  <div className="row-actions">
                    <button className="icon-btn" onClick={()=>setModal({type:'despesa', item:d})}>Editar</button>
                    <button className="icon-btn danger" onClick={()=>handleRemove(d)}>Remover</button>
                  </div>
                </td>
              </tr>
            ))}
            {filtradas.length===0 && <tr><td colSpan="8" className="empty">Nenhuma despesa registada para este filtro.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal && modal.type==='despesa' && (
        <Modal title={data.despesas.some(x=>x.id===modal.item.id) ? 'Editar despesa' : 'Nova despesa'} onClose={()=>setModal(null)}>
          <DespesaForm item={modal.item} imoveis={data.imoveis} onSave={handleSave} onCancel={()=>setModal(null)} />
        </Modal>
      )}
    </PageShell>
  );
}

function DespesaForm({item, imoveis, onSave, onCancel}){
  const [f, setF] = useState(item);
  const [pendingFile, setPendingFile] = useState(null);
  const [removeExisting, setRemoveExisting] = useState(false);
  const [error, setError] = useState('');
  const set = (k,v)=>setF(s=>({...s,[k]:v}));

  const onFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    setError('');
    if(!file) return;
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const isImage = file.type.startsWith('image/');
    if(!isPdf && !isImage){ setError('Anexe um PDF ou uma imagem (foto da fatura/recibo).'); e.target.value=''; return; }

    if(isImage){
      compressImageFile(file).then(({base64, tipo}) => {
        setPendingFile({nome:file.name, tipo, base64});
        setRemoveExisting(false);
      }).catch(() => setError('Não foi possível processar a imagem.'));
      return;
    }
    if(file.size > MAX_ANEXO_BYTES){ setError('O PDF é demasiado grande (máx. 2 MB).'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      setPendingFile({nome:file.name, tipo:file.type || 'application/pdf', base64});
      setRemoveExisting(false);
    };
    reader.onerror = () => setError('Não foi possível ler o ficheiro.');
    reader.readAsDataURL(file);
  };

  const handleSubmit = () => {
    let fileAction = null;
    if(pendingFile) fileAction = {type:'set', ...pendingFile};
    else if(removeExisting) fileAction = {type:'remove'};
    onSave(f, fileAction);
  };

  return (
    <React.Fragment>
      <div className="form-grid">
        <div className="field"><label>Imóvel</label>
          <select value={f.imovelId} onChange={e=>set('imovelId',e.target.value)}>
            <option value="">—</option>
            {imoveis.map(im=><option key={im.id} value={im.id}>{im.nome}</option>)}
          </select>
        </div>
        <div className="field"><label>Data</label><input type="date" value={f.data} onChange={e=>set('data',e.target.value)} /></div>
        <div className="field"><label>Categoria</label>
          <select value={f.categoria} onChange={e=>set('categoria',e.target.value)}>
            {CATEGORIAS_DESPESA.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div className="field"><label>Valor (€)</label><input type="number" value={f.valor} onChange={e=>set('valor',e.target.value)} /></div>
        <div className="field full"><label>Descrição</label><input value={f.descricao} onChange={e=>set('descricao',e.target.value)} /></div>
        <div className="field">
          <label>Dedutível no IRS (Categoria F)</label>
          <select value={f.dedutivel ? '1' : '0'} onChange={e=>set('dedutivel', e.target.value==='1')}>
            <option value="1">Sim</option>
            <option value="0">Não</option>
          </select>
        </div>
        <div className="field"><label>Ano fiscal</label><input type="number" value={f.data ? Number(f.data.slice(0,4)) : f.anoFiscal} disabled style={{color:'var(--gray)'}} /></div>

        <div className="field full">
          <label>Comprovativo (PDF ou foto da fatura)</label>
          <input type="file" accept="application/pdf,.pdf,image/*" onChange={onFileChange} />
          {error && <div style={{color:'var(--rust)', fontSize:12}}>{error}</div>}
          {pendingFile && <div style={{color:'var(--verdigris)', fontSize:12}}>Pronto para guardar: {pendingFile.nome}</div>}
          {!pendingFile && f.temComprovativo && !removeExisting && (
            <div style={{display:'flex', alignItems:'center', gap:10, fontSize:12, color:'var(--gray)'}}>
              <span>Comprovativo atual: {f.comprovativoNome}</span>
              <button type="button" className="icon-btn danger" onClick={()=>setRemoveExisting(true)}>Remover</button>
            </div>
          )}
          {removeExisting && <div style={{color:'var(--rust)', fontSize:12}}>O comprovativo será removido ao guardar.</div>}
        </div>

        <div className="field full"><label>Notas</label><textarea value={f.notas} onChange={e=>set('notas',e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" onClick={handleSubmit}>Guardar</button>
      </div>
    </React.Fragment>
  );
}

                <tr key={t.id}>
                  <td style={{fontWeight:600, textDecoration: t.concluida ? 'line-through' : 'none', color: t.concluida ? 'var(--gray)' : 'var(--charcoal)'}}>{t.titulo}</td>
                  <td>{t.dataLimite ? fmtDate(t.dataLimite) : '—'}</td>
                  <td>
                    {t.concluida ? <Tag kind="verdigris">Concluída</Tag> :
                      (d!==null && d<0) ? <Tag kind="rust">Atrasada</Tag> :
                      (d!==null && d<=7) ? <Tag kind="amber">Em breve</Tag> : <Tag kind="gray">Pendente</Tag>}
                  </td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" onClick={()=>addOrEdit('tarefas', {...t, concluida:!t.concluida})}>{t.concluida ? 'Reabrir' : 'Concluir'}</button>
                      <button className="icon-btn" onClick={()=>setModal({type:'tarefa', item:t})}>Editar</button>
                      <button className="icon-btn danger" onClick={()=>remove('tarefas', t.id)}>Remover</button>
                    </div>
                  </td>
                </tr>
              );
            })}
            {ordenadas.length===0 && <tr><td colSpan="4" className="empty">Sem tarefas registadas.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal && modal.type==='tarefa' && (
        <Modal title={data.tarefas.some(x=>x.id===modal.item.id) ? 'Editar tarefa' : 'Nova tarefa'} onClose={()=>setModal(null)}>
          <TarefaForm item={modal.item} onSave={(it)=>{addOrEdit('tarefas',it); setModal(null);}} onCancel={()=>setModal(null)} />
        </Modal>
      )}
    </PageShell>
  );
}

function TarefaForm({item, onSave, onCancel}){
  const [f, setF] = useState(item);
  const set = (k,v)=>setF(s=>({...s,[k]:v}));
  return (
    <React.Fragment>
      <div className="form-grid">
        <div className="field full"><label>Título</label><input value={f.titulo} onChange={e=>set('titulo',e.target.value)} /></div>
        <div className="field"><label>Prazo</label><input type="date" value={f.dataLimite} onChange={e=>set('dataLimite',e.target.value)} /></div>
        <div className="field full"><label>Notas</label><textarea value={f.notas} onChange={e=>set('notas',e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" onClick={()=>onSave(f)}>Guardar</button>
      </div>
    </React.Fragment>
  );
}

/* ============================== Documentos ============================== */
function DocumentosView({data, addOrEdit, remove, modal, setModal}){
  const empty = {id:'', nome:'', categoria:'', imovelId:'', data:todayISO(), notas:'', temAnexo:false, anexoNome:'', anexoTipo:''};
  const imovelNome = (id) => { const im = data.imoveis.find(i=>i.id===id); return im ? im.nome : '—'; };
  const [busyId, setBusyId] = useState(null);

  const handleSave = async (formData, fileAction) => {
    let updated = {...formData};
    if(fileAction && fileAction.type==='set'){
      if(!storageAvailable()){
        alert('O seu navegador não permite guardar anexos neste contexto (ex: modo privado). O documento foi guardado sem o PDF.');
      } else {
        try{
          await storeSet('predial:anexo:'+formData.id, fileAction.base64);
          updated = {...updated, temAnexo:true, anexoNome:fileAction.nome, anexoTipo:fileAction.tipo};
        } catch(e){
          console.error('Falha ao guardar anexo:', e);
          const detalhe = (e && e.name === 'QuotaExceededError')
            ? 'o espaço de armazenamento do navegador está cheio'
            : ((e && e.message) || 'erro desconhecido');
          alert('Não foi possível guardar o PDF (' + detalhe + '). O documento foi guardado sem anexo.');
        }
      }
    } else if(fileAction && fileAction.type==='remove'){
      await storeDelete('predial:anexo:'+formData.id);
      updated = {...updated, temAnexo:false, anexoNome:'', anexoTipo:''};
    }
    addOrEdit('documentos', updated);
    setModal(null);
  };

  const handleView = async (doc) => {
    setBusyId(doc.id);
    try{
      const raw = await storeGet('predial:anexo:'+doc.id);
      if(!raw){ alert('Anexo não encontrado.'); return; }
      const blob = base64ToBlob(raw, doc.anexoTipo);
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    } catch(e){
      alert('Não foi possível abrir o anexo.');
    } finally {
      setBusyId(null);
    }
  };

  const handleRemove = async (doc) => {
    if(doc.temAnexo){
      await storeDelete('predial:anexo:'+doc.id);
    }
    remove('documentos', doc.id);
  };

  return (
    <PageShell title="Documentos" subtitle="Arquive PDFs por imóvel (escrituras, seguros, faturas, contratos digitalizados…)." onNew={()=>setModal({type:'doc', item:{...empty, id:uid('DC')}})}>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Documento</th><th>Categoria</th><th>Imóvel</th><th>Data</th><th>Anexo</th><th></th></tr></thead>
          <tbody>
            {data.documentos.map(d=>(
              <tr key={d.id}>
                <td style={{fontWeight:600}}>{d.nome}</td>
                <td>{d.categoria}</td>
                <td>{imovelNome(d.imovelId)}</td>
                <td>{fmtDate(d.data)}</td>
                <td>
                  {d.temAnexo ? (
                    <button className="icon-btn" disabled={busyId===d.id} onClick={()=>handleView(d)}>
                      📎 {busyId===d.id ? 'A abrir…' : (d.anexoNome || 'Ver PDF')}
                    </button>
                  ) : <span style={{color:'var(--gray)', fontSize:12}}>Sem anexo</span>}
                </td>
                <td>
                  <div className="row-actions">
                    <button className="icon-btn" onClick={()=>setModal({type:'doc', item:d})}>Editar</button>
                    <button className="icon-btn danger" onClick={()=>handleRemove(d)}>Remover</button>
                  </div>
                </td>
              </tr>
            ))}
            {data.documentos.length===0 && <tr><td colSpan="6" className="empty">Nenhum documento arquivado.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal && modal.type==='doc' && (
        <Modal title={data.documentos.some(x=>x.id===modal.item.id) ? 'Editar documento' : 'Novo documento'} onClose={()=>setModal(null)}>
          <DocForm item={modal.item} imoveis={data.imoveis} onSave={handleSave} onCancel={()=>setModal(null)} />
        </Modal>
      )}
    </PageShell>
  );
}

function DocForm({item, imoveis, onSave, onCancel}){
  const [f, setF] = useState(item);
  const [pendingFile, setPendingFile] = useState(null); // {nome, tipo, base64}
  const [removeExisting, setRemoveExisting] = useState(false);
  const [error, setError] = useState('');
  const set = (k,v)=>setF(s=>({...s,[k]:v}));

  const onFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    setError('');
    if(!file) return;
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if(!isPdf){ setError('Só é possível anexar ficheiros PDF.'); e.target.value=''; return; }
    if(file.size > MAX_ANEXO_BYTES){ setError('O PDF é demasiado grande (máx. 2 MB).'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      setPendingFile({nome:file.name, tipo:file.type || 'application/pdf', base64});
      setRemoveExisting(false);
      if(!f.nome) set('nome', file.name.replace(/\.pdf$/i,''));
    };
    reader.onerror = () => setError('Não foi possível ler o ficheiro.');
    reader.readAsDataURL(file);
  };

  const handleSubmit = () => {
    let fileAction = null;
    if(pendingFile) fileAction = {type:'set', ...pendingFile};
    else if(removeExisting) fileAction = {type:'remove'};
    onSave(f, fileAction);
  };

  return (
    <React.Fragment>
      <div className="form-grid">
        <div className="field full"><label>Nome do documento</label><input value={f.nome} onChange={e=>set('nome',e.target.value)} /></div>
        <div className="field"><label>Categoria</label><input placeholder="ex: Escritura, Seguro, Fatura…" value={f.categoria} onChange={e=>set('categoria',e.target.value)} /></div>
        <div className="field"><label>Imóvel</label>
          <select value={f.imovelId} onChange={e=>set('imovelId',e.target.value)}>
            <option value="">—</option>
            {imoveis.map(im=><option key={im.id} value={im.id}>{im.nome}</option>)}
          </select>
        </div>
        <div className="field"><label>Data</label><input type="date" value={f.data} onChange={e=>set('data',e.target.value)} /></div>
        <div className="field full">
          <label>Anexar PDF</label>
          <input type="file" accept="application/pdf,.pdf" onChange={onFileChange} />
          {error && <div style={{color:'var(--rust)', fontSize:12}}>{error}</div>}
          {pendingFile && <div style={{color:'var(--verdigris)', fontSize:12}}>Pronto para guardar: {pendingFile.nome}</div>}
          {!pendingFile && f.temAnexo && !removeExisting && (
            <div style={{display:'flex', alignItems:'center', gap:10, fontSize:12, color:'var(--gray)'}}>
              <span>Anexo atual: {f.anexoNome}</span>
              <button type="button" className="icon-btn danger" onClick={()=>setRemoveExisting(true)}>Remover anexo</button>
            </div>
          )}
          {removeExisting && <div style={{color:'var(--rust)', fontSize:12}}>O anexo será removido ao guardar.</div>}
        </div>
        <div className="field full"><label>Notas</label><textarea value={f.notas} onChange={e=>set('notas',e.target.value)} /></div>
      </div>
      <div className="modal-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" onClick={handleSubmit}>Guardar</button>
      </div>
    </React.Fragment>
  );
}

/* ============================== Mount ============================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
